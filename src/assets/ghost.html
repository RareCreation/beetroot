<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
    <title>Ghost</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: transparent; overflow: hidden; }
        .ghost-wrap {
            position: absolute;
            inset: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s ease;
        }
        .ghost {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-radius: 7px;
            background: rgba(28, 10, 18, .92);
            border: 1px solid rgba(255, 120, 130, .25);
            box-shadow: 0 12px 32px rgba(0, 0, 0, .55);
            backdrop-filter: blur(12px) saturate(160%);
            color: #ff8c90;
            font: 500 11px "Cascadia Mono", Consolas, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: border-color .15s ease, background .15s ease;
        }
        .ghost.target {
            border-color: #5ad6c0;
            background: rgba(20, 40, 36, .92);
            color: #8affe0;
        }
        .ghost-title {
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="ghost-wrap" id="ghost-wrap">
    <div class="ghost" id="ghost">
        <span class="ghost-title" id="ghost-title">Terminal</span>
    </div>
</div>
<script>
    (function () {
        const wrap = document.getElementById('ghost-wrap');
        const ghost = document.getElementById('ghost');
        const title = document.getElementById('ghost-title');

        window.api.onGhostUpdate(function (data) {
            if (!data) return;
            if (typeof data.title === 'string') title.textContent = data.title;
            const rotate = Number(data.rotate) || 0;
            const scale = Number(data.scale) || 1;
            wrap.style.transform = 'rotate(' + rotate + 'deg) scale(' + scale + ')';
            ghost.classList.toggle('target', !!data.targetId);
        });
    })();
</script>
</body>
</html>
